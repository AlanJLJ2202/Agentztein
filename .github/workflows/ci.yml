name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillab
          POSTGRES_PASSWORD: skillab
          POSTGRES_DB: skillab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillab" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://skillab:skillab@localhost:5432/skillab
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
