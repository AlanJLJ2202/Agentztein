# evolve: one user's Agentztein changes its own code, with that user's own Meta key.
#
# The app starts it (workflow_dispatch from /api/evolve) with a run id, the run's one-time token and the app's URL.
#   1. asks the app for the run (/api/evolve-ci): the user's key (masked), models, spending cap, hypothesis and
#      their current core (their active version, or the platform's packages/agent-core)
#   2. measures that core on the practice set and prepares a workshop with only the core
#   3. Muse Code (`muse exec`) changes it, as an unprivileged user that can't read the repo or the runner's files;
#      Forja (Muse + function calling) takes over if Muse Code can't run
#   4. the judge gives the current core and the new one a fresh exam (random seed, held-out profile), each in a
#      sandboxed child process without the key, and sends everything back: the app re-checks the code and the
#      verdict and, if it passes, makes it the user's active core
#
# Setup: docs/EVOLVE.md (the only repo secret is EVOLVE_CI_SECRET).
name: evolve
run-name: "evolve · run ${{ inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id (from the app)"
        required: true
      token:
        description: "The run's one-time token (from the app)"
        required: true
      app_url:
        description: "The app's URL (https)"
        required: true

concurrency:
  group: evolve-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EVOLVE_RUN_ID: ${{ inputs.run_id }}
      EVOLVE_RUN_TOKEN: ${{ inputs.token }}
      EVOLVE_APP_URL: ${{ inputs.app_url }}
      RUN: ${{ github.workspace }}/../_evolve
    steps:
      - name: Hide the run token
        run: echo "::add-mask::$EVOLVE_RUN_TOKEN"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Get the run from the app (the user's key stays in a file only the runner can read)
        id: run
        env:
          EVOLVE_CI_SECRET: ${{ secrets.EVOLVE_CI_SECRET }}
        run: |
          test -n "$EVOLVE_CI_SECRET" || { echo "::error::Secret EVOLVE_CI_SECRET is missing (docs/EVOLVE.md)"; exit 1; }
          mkdir -p "$RUN" && chmod 700 "$RUN"
          pnpm -s evolve:ci start --out "$RUN"
          cat "$RUN/idea.md"

      - name: Spending caps
        id: caps
        run: node -e 'const m=Number(process.argv[1])||1; console.log(`bench=${(m*0.15).toFixed(3)}\nforja=${(m*0.55).toFixed(3)}`)' "${{ steps.run.outputs.max_usd }}" >> "$GITHUB_OUTPUT"

      - name: Measure the current core on the practice set
        env:
          META_MODEL: ${{ steps.run.outputs.executor }}
        run: |
          META_API_KEY="$(cat "$RUN/key")" pnpm evolve:bench --core "$RUN/base-core" --set practice --mistakes --max-usd "${{ steps.caps.outputs.bench }}" --out "$RUN/practice.json"

      - name: Prepare the workshop (only the core goes in)
        run: |
          pnpm -s evolve:ci stage --stage building
          pnpm evolve:workshop prepare --out /tmp/workshop --core "$RUN/base-core" --idea "$RUN/idea.md" --practice "$RUN/practice.json" --model "${{ steps.run.outputs.executor }}"
        env:
          EVOLVE_CI_SECRET: ${{ secrets.EVOLVE_CI_SECRET }}

      - name: Lock the builder out of the repo
        run: |
          # The builder (Muse Code, or the code Forja writes and tests) runs as "builder": no sudo, it can read and
          # write the workshop and nothing of the runner's home (not the repo, not the key file, not the CI secret).
          sudo useradd -m -s /bin/bash builder
          chmod 700 "$HOME"
          chmod -R a+rwX /tmp/workshop
          sudo -u builder test ! -r "$GITHUB_WORKSPACE/package.json" && echo "builder can't read the repo ✓"

      - name: Install Muse Code (as builder)
        id: muse
        if: steps.run.outputs.builder == 'muse-code'
        continue-on-error: true
        env:
          MUSE_INSTALL_URL: ${{ vars.MUSE_INSTALL_URL || 'https://dev.meta.ai/install.sh' }}
          MUSE_INSTALL_SHA256: ${{ vars.MUSE_INSTALL_SHA256 }}
        run: |
          set -o pipefail
          curl -fsSL "$MUSE_INSTALL_URL" -o /tmp/muse-install.sh
          if [ -n "$MUSE_INSTALL_SHA256" ]; then echo "$MUSE_INSTALL_SHA256  /tmp/muse-install.sh" | sha256sum -c -; fi
          chmod a+r /tmp/muse-install.sh
          sudo -u builder -H env -i PATH="$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" HOME=/home/builder sh /tmp/muse-install.sh
          sudo -u builder -H env -i PATH="/home/builder/.local/bin:/usr/bin:/bin" HOME=/home/builder bash -c 'command -v muse && muse --version'

      - name: Build with Muse Code (as builder, with the user's key)
        id: musebuild
        if: steps.run.outputs.builder == 'muse-code' && steps.muse.outcome == 'success'
        continue-on-error: true
        env:
          MUSE_FLAGS: ${{ vars.MUSE_EXEC_FLAGS || '--yolo' }}
        run: |
          set -o pipefail
          sudo -u builder -H env -i PATH="/home/builder/.local/bin:$(dirname "$(command -v node)"):/usr/bin:/bin" HOME=/home/builder \
            META_API_KEY="$(cat "$RUN/key")" MUSE_FLAGS="$MUSE_FLAGS" \
            bash -c 'cd /tmp/workshop && timeout 40m muse exec $MUSE_FLAGS "$(cat BRIEF.md)"' 2>&1 | tail -n 200
          # it counts only if it changed the core
          if diff -rq /tmp/workshop/agent-core "$RUN/base-core" -x node_modules > /dev/null; then echo "::warning::Muse Code didn't change the core"; exit 1; fi
          echo "muse-code" > "$RUN/builder.txt"

      - name: Build with Forja (Muse + function calling, with the user's key)
        if: steps.run.outputs.builder == 'forja' || steps.muse.outcome != 'success' || steps.musebuild.outcome != 'success'
        env:
          META_MODEL: ${{ steps.run.outputs.executor }}
          META_PLANNER_MODEL: ${{ steps.run.outputs.planner }}
          FORJA_RUN_AS: builder
        run: |
          echo "forja" > "$RUN/builder.txt"
          META_API_KEY="$(cat "$RUN/key")" pnpm evolve:forja --dir /tmp/workshop --max-turns 40 --max-usd "${{ steps.caps.outputs.forja }}" --usage-out "$RUN/forja.json"

      - name: Check the new core (rules, and its own tests as builder)
        run: |
          if diff -rq /tmp/workshop/agent-core "$RUN/base-core" -x node_modules > /dev/null; then echo "::error::The builder didn't change the core"; exit 1; fi
          pnpm -s evolve:gate scan --dir /tmp/workshop/agent-core --strict
          tests=$(ls /tmp/workshop/agent-core/test/*.test.mjs 2>/dev/null || true)
          if [ -n "$tests" ]; then
            # shellcheck disable=SC2086
            sudo -u builder env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" HOME=/home/builder bash -c "cd /tmp/workshop && node --test $tests"
          fi

      - name: Fresh exam, current core vs new core
        env:
          META_MODEL: ${{ steps.run.outputs.executor }}
          EVOLVE_CI_SECRET: ${{ secrets.EVOLVE_CI_SECRET }}
        run: |
          pnpm -s evolve:ci stage --stage judging
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          export META_API_KEY="$(cat "$RUN/key")"
          pnpm evolve:bench --core "$RUN/base-core" --set fresh --seed "$seed" --max-usd "${{ steps.caps.outputs.bench }}" --out "$RUN/base.json" &
          pnpm evolve:bench --core /tmp/workshop/agent-core --set fresh --seed "$seed" --max-usd "${{ steps.caps.outputs.bench }}" --out "$RUN/head.json" &
          wait

      - name: Send the result to the app (it re-checks and decides)
        env:
          EVOLVE_CI_SECRET: ${{ secrets.EVOLVE_CI_SECRET }}
        run: |
          pnpm -s evolve:ci finish --candidate /tmp/workshop/agent-core --base "$RUN/base.json" --head "$RUN/head.json" \
            --practice "$RUN/practice.json" --changes /tmp/workshop/CHANGES.md --builder "$(cat "$RUN/builder.txt")" \
            --usage "$RUN/practice.json,$RUN/base.json,$RUN/head.json,$RUN/forja.json"

      - name: Tell the app it failed
        if: failure()
        env:
          EVOLVE_CI_SECRET: ${{ secrets.EVOLVE_CI_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pnpm -s evolve:ci fail --stage ci --error "The run failed in GitHub Actions: $RUN_URL" || true

      - name: Forget the key
        if: always()
        run: rm -f "$RUN/key"
