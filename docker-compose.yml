services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skillab
      POSTGRES_PASSWORD: skillab
      POSTGRES_DB: skillab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillab"]
      interval: 5s
      retries: 10
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
